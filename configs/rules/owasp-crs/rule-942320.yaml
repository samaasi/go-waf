id: "942320"
msg: Detects MySQL and PostgreSQL stored procedure/function injections
severity: 25
phase: 2
action: block
pre_filter_keyword: ""
conditions:
    - operator: '@rx'
      variable: REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/*
      value: (?i:(?:creates+(?:procedure|function)s*?w+s*?(s*?)s*?-|;s*?(?:declare|open)s+[w-]+|procedures+analyses*?(|declare[^w]+[@#]s*?w+|execs*?(s*?@))
      transformations:
        - t:none
        - t:urlDecodeUni
actions:
    - type: setvar
      key: tx.sql_injection_score
      value: +%{tx.critical_anomaly_score}
    - type: setvar
      key: tx.anomaly_score_pl1
      value: +%{tx.critical_anomaly_score}
chain: []
tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-sqli
    - paranoia-level/1
    - OWASP_CRS
    - capec/1000/152/248/66
    - PCI/6.5.2
