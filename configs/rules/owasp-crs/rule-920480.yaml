id: "920480"
msg: Request content type charset is not allowed by policy
severity: 25
phase: 1
action: block
pre_filter_keyword: charset
conditions:
    - operator: '@rx'
      variable: REQUEST_HEADERS:Content-Type
      value: charsets*=s*["']?([^;"'s]+)
      transformations:
        - t:none
        - t:lowercase
actions: []
chain:
    - id: ""
      msg: ""
      severity: 10
      phase: 2
      action: block
      pre_filter_keyword: allowed_request_content_type_charset}
      conditions:
        - operator: '!@rx'
          variable: TX:1
          value: ^%{tx.allowed_request_content_type_charset}$
          transformations:
            - t:none
      actions:
        - type: ctl
          key: forceRequestBodyVariable
          value: "On"
        - type: setvar
          key: tx.anomaly_score_pl1
          value: +%{tx.critical_anomaly_score}
      chain: []
      tags: []
tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS
    - capec/1000/255/153
    - PCI/12.1
