id: "910160"
msg: HTTP Blacklist match for spammer IP
severity: 25
phase: 2
action: block
pre_filter_keyword: ""
conditions:
    - operator: '@eq'
      variable: TX:block_spammer_ip
      value: "1"
      transformations:
        - t:none
actions: []
chain:
    - id: ""
      msg: ""
      severity: 10
      phase: 2
      action: block
      pre_filter_keyword: ' spammer '
      conditions:
        - operator: '@rx'
          variable: TX:httpbl_msg
          value: (?i)^.*? spammer .*?$
          transformations: []
      actions:
        - type: setvar
          key: tx.anomaly_score_pl1
          value: +%{tx.critical_anomaly_score}
        - type: setvar
          key: ip.reput_block_flag
          value: "1"
        - type: setvar
          key: ip.reput_block_reason
          value: '%{rule.msg}'
        - type: setvar
          key: ip.previous_rbl_check
          value: "1"
        - type: expirevar
          key: ip.reput_block_flag
          value: '%{tx.reput_block_duration}'
        - type: expirevar
          key: ip.previous_rbl_check
          value: "86400"
      chain: []
      tags: []
tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-reputation-ip
    - paranoia-level/1
    - OWASP_CRS
