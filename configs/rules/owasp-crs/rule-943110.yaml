      transformations:
        - t:none
        - t:urlDecodeUni
        - t:lowercase
actions: []
chain:
    - id: ""
      msg: ""
      severity: 10
      phase: 2
      action: block
      pre_filter_keyword: ://
      conditions:
        - operator: '@rx'
          variable: REQUEST_HEADERS:Referer
          value: ^(?:ht|f)tps?://(.*?)/
          transformations: []
      actions: []
      chain: []
      tags: []
    - id: ""
      msg: ""
      severity: 10
      phase: 2
      action: block
      pre_filter_keyword: ""
      conditions:
        - operator: '!@endsWith'
          variable: TX:1
          value: '%{request_headers.host}'
          transformations: []
