id: "920440"
msg: URL file extension is restricted by policy
severity: 25
phase: 2
action: block
pre_filter_keyword: ""
conditions:
    - operator: '@rx'
      variable: REQUEST_BASENAME
      value: .([^.]+)$
      transformations:
        - t:none
actions:
    - type: setvar
      key: tx.extension
      value: .%{tx.1}/
chain:
    - id: ""
      msg: ""
      severity: 10
      phase: 2
      action: block
      pre_filter_keyword: ""
      conditions:
        - operator: '@within'
          variable: TX:EXTENSION
          value: '%{tx.restricted_extensions}'
          transformations:
            - t:none
            - t:urlDecodeUni
            - t:lowercase
      actions:
        - type: setvar
          key: tx.anomaly_score_pl1
          value: +%{tx.critical_anomaly_score}
      chain: []
      tags: []
tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS
    - capec/1000/210/272
    - PCI/6.5.10
