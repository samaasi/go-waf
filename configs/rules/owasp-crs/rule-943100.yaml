id: "943100"
msg: 'Possible Session Fixation Attack: Setting Cookie Values in HTML'
severity: 25
phase: 2
action: block
pre_filter_keyword: bhttp-equiv
conditions:
    - operator: '@rx'
      variable: REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/*
      value: (?i:.cookieb.*?;W*?(?:expires|domain)W*?=|bhttp-equivW+set-cookieb)
      transformations:
        - t:none
        - t:urlDecodeUni
actions:
    - type: ctl
      key: auditLogParts
      value: +E
    - type: setvar
      key: tx.session_fixation_score
      value: +%{tx.critical_anomaly_score}
    - type: setvar
      key: tx.anomaly_score_pl1
      value: +%{tx.critical_anomaly_score}
chain: []
tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-fixation
    - paranoia-level/1
    - OWASP_CRS
    - capec/1000/225/21/593/61
