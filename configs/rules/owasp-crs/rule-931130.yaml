id: "931130"
msg: 'Possible Remote File Inclusion (RFI) Attack: Off-Domain Reference/Link'
severity: 25
phase: 2
action: block
pre_filter_keyword: http
conditions:
    - operator: '@rx'
      variable: ARGS
      value: ^(?i:file|ftps?|https?)://([^/]*).*$
      transformations:
        - t:none
actions:
    - type: setvar
      key: tx.rfi_parameter_%{MATCHED_VAR_NAME}
      value: .%{tx.1}
chain:
    - id: ""
      msg: ""
      severity: 10
      phase: 2
      action: block
      pre_filter_keyword: ""
      conditions:
        - operator: '!@endsWith'
          variable: TX:/rfi_parameter_.*/
          value: .%{request_headers.host}
          transformations: []
      actions:
        - type: ctl
          key: auditLogParts
          value: +E
        - type: setvar
          key: tx.rfi_score
          value: +%{tx.critical_anomaly_score}
        - type: setvar
          key: tx.anomaly_score_pl2
          value: +%{tx.critical_anomaly_score}
      chain: []
      tags: []
tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-rfi
    - OWASP_CRS
    - capec/1000/152/175/253
    - paranoia-level/2
