id: "920420"
msg: Request content type is not allowed by policy
severity: 25
phase: 2
action: block
pre_filter_keyword: ""
conditions:
    - operator: '@rx'
      variable: REQUEST_HEADERS:Content-Type
      value: ^[^;s]+
      transformations:
        - t:none
actions:
    - type: setvar
      key: tx.content_type
      value: '|%{tx.0}|'
chain:
    - id: ""
      msg: ""
      severity: 10
      phase: 2
      action: block
      pre_filter_keyword: ""
      conditions:
        - operator: '!@within'
          variable: TX:content_type
          value: '%{tx.allowed_request_content_type}'
          transformations:
            - t:lowercase
      actions:
        - type: setvar
          key: tx.anomaly_score_pl1
          value: +%{tx.critical_anomaly_score}
      chain: []
      tags: []
tags:
    - application-multi
    - language-multi
    - platform-multi
    - attack-protocol
    - paranoia-level/1
    - OWASP_CRS
    - capec/1000/255/153
    - PCI/12.1
