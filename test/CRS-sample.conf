# Sample OWASP CRS Rules

SecRule REQUEST_URI "@rx (?i)\b(union|select|insert|update|delete|drop)\b" "id:942100,phase:2,block,t:lowercase,msg:'SQL Injection Attack Detected'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(nikto|nmap|sqlmap)" "id:913100,phase:1,block,t:lowercase,msg:'Malicious Scanner Detected'"

SecRule ARGS "@contains ../" "id:930100,phase:2,block,t:removeWhitespace,msg:'Path Traversal Attack Detected'"
